# main 上的插件文件有变化（通常是合并了 sync PR）时：跑测试、打 v<版本>-video.<n> 标签、发 GitHub Release。
name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "fork/**"
      - ".github/**"
      - ".claude/**"
      - "FORK.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin upstream:upstream
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fork/fork.sh release
